<script>
const SUPABASE_URL='https://lpruaeiadbmuktsosiur.supabase.co';
const SUPABASE_KEY='sb_publishable_eR96pHoE-uu5qLJECPTOUw_loScd0oo';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const PRICE=0.25, COMPANY='PRODUCTOS LÁCTEOS RAMIREZ SPR DE RL DE CV', BRAND='Quesos Los Sauces';
let currentUser=null,currentProfile=null,tanks=[],tankId=1,tab='inicio',selectedMonth='';
const app=document.getElementById('app'),modal=document.getElementById('modal');
const esc=(s='')=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const num=n=>Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0});
const money=n=>Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const ADMIN_PERMS={measure:true,withdraw:true,view_all:true,edit_movements:true,delete_movements:true,manage_tanks:true,manage_users:true,export:true,finance:true};
function perms(){if(currentProfile?.role==='admin')return ADMIN_PERMS;const p=currentProfile?.permissions||{};return {measure:p.measure??['employee','office'].includes(currentProfile?.role),withdraw:p.withdraw??currentProfile?.role==='pipero',view_all:!!p.view_all,edit_movements:!!p.edit_movements,delete_movements:!!p.delete_movements,manage_tanks:!!p.manage_tanks,manage_users:!!p.manage_users,export:!!p.export,finance:!!p.finance}}
function monthKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function monthRange(key){const [y,m]=key.split('-').map(Number),start=new Date(y,m-1,1),next=new Date(y,m,1);return {start,next,label:start.toLocaleDateString('es-MX',{month:'long',year:'numeric'})}}
function reportHead(title){return `<div class="reporthead"><img src="logo.jpg"><div><b style="font-size:20px">${BRAND}</b><div>${COMPANY}</div><div class="small">${esc(title)}</div></div></div>`}
function tankLiters(t,h){h=Number(h)||0;if(t.geometry_type==='horizontal_cylinder'&&t.diameter_cm&&t.length_cm){const D=Number(t.diameter_cm),L=Number(t.length_cm),R=D/2;if(h<=0)return 0;if(h>=D)return Math.PI*R*R*L/1000;const a=Math.acos((R-h)/R);return (R*R*a-(R-h)*Math.sqrt(Math.max(0,2*R*h-h*h)))*L/1000}if(t.geometry_type==='vertical_cylinder'&&t.diameter_cm){const r=Number(t.diameter_cm)/2;return Math.PI*r*r*Math.max(0,h)/1000}return Math.max(0,Math.min(Number(t.capacity_liters)||0,h))}
function calibrated(t){return (t.geometry_type==='horizontal_cylinder'&&t.diameter_cm&&t.length_cm)||(t.geometry_type==='vertical_cylinder'&&t.diameter_cm)}
function geoName(t){return t.geometry_type==='horizontal_cylinder'?'Pipa / cilindro horizontal':t.geometry_type==='vertical_cylinder'?'Cilíndrico vertical':'Captura directa'}
async function bootstrapAdmin(){try{await fetch(SUPABASE_URL+'/functions/v1/bootstrap-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'saul',display_name:'Saúl Administrador',password:'MilkWhey-2608!'})})}catch(e){}}
async function loadProfile(){const {data,error}=await sb.from('app_users').select('*').eq('id',currentUser.id).single();if(error)throw error;currentProfile=data}
async function loadTanks(){const {data,error}=await sb.from('tanks').select('*').eq('active',true).order('id');if(!error&&data){tanks=data;if(!tanks.some(t=>Number(t.id)===Number(tankId))&&tanks.length)tankId=tanks[0].id}}
async function login(){const username=document.getElementById('username').value.trim().toLowerCase(),password=document.getElementById('password').value;const {data,error}=await sb.auth.signInWithPassword({email:username+'@milk-wheyapp.local',password});if(error)return loginView('Usuario o contraseña incorrectos.');currentUser=data.user;await loadProfile();if(!currentProfile.active){await sb.auth.signOut();return loginView('Esta cuenta está desactivada.')}await loadTanks();render()}
function loginView(msg=''){app.innerHTML=`<div class="login"><div style="text-align:center"><img src="logo.jpg" style="width:150px;max-width:45vw;border-radius:18px;background:#fff"><div class="brand" style="margin-top:10px">Milk-WheyApp <span class="tag">V7</span></div><div>${BRAND}</div><div class="tiny muted">${COMPANY}</div></div><div class="card"><div class="section">Iniciar sesión</div>${msg?`<p class="err small">${esc(msg)}</p>`:''}<label class="small muted">Usuario</label><input id="username" class="input" placeholder="Ej. saul"><div style="height:10px"></div><label class="small muted">Contraseña</label><input id="password" class="input" type="password"><div style="height:12px"></div><button id="enter" class="btn green" style="width:100%">ENTRAR</button></div></div>`;document.getElementById('enter').onclick=login;document.getElementById('password').onkeydown=e=>{if(e.key==='Enter')login()}}
async function render(){if(!currentProfile)return loginView();const p=perms(),tabs=[['inicio','Inicio']];if(p.measure||p.withdraw)tabs.push(['tanques','Tanques']);tabs.push(['historial','Movimientos']);if(p.finance)tabs.push(['cortes','Cortes'],['estadisticas','Estadísticas']);if(p.manage_users||p.manage_tanks)tabs.push(['admin','Administración']);app.innerHTML=`<div class="top"><div class="brandwrap"><img class="brandlogo" src="logo.jpg"><div><div class="brand">Milk-WheyApp <span class="tag">V7</span></div><div class="small">${BRAND}</div><div class="corp">${COMPANY}<br>${esc(currentProfile.display_name)} • ${esc(currentProfile.role)}</div></div></div><button id="logout" class="logout">Salir</button></div><div class="card no-print"><div class="tabs">${tabs.map(([id,l])=>`<button class="tab ${tab===id?'active':''}" data-tab="${id}">${l}</button>`).join('')}</div></div><div id="content"></div>`;document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();currentUser=currentProfile=null;loginView()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});if(tab==='inicio')homeView();if(tab==='tanques')tankView();if(tab==='historial')historyView();if(tab==='cortes')cutsView();if(tab==='estadisticas')statsView();if(tab==='admin')adminView()}
function homeView(){const p=perms(),c=document.getElementById('content');c.innerHTML=`<div class="card"><div class="section">Bienvenido, ${esc(currentProfile.display_name)}</div><div class="notice">Permisos activos: ${[p.measure?'mediciones':'',p.withdraw?'retiros':'',p.export?'exportar':'',p.finance?'finanzas':''].filter(Boolean).join(' • ')||'consulta'}</div>${(p.measure||p.withdraw)?'<div style="height:12px"></div><button id="goTank" class="btn green" style="width:100%">REGISTRAR MOVIMIENTO</button>':''}</div><div class="card"><div class="section">Tanques activos</div><div class="grid g3">${tanks.map(t=>`<div class="tank"><b>${esc(t.name)}</b><div class="small muted">${num(t.capacity_liters)} L<br>${geoName(t)}</div></div>`).join('')}</div></div>`;if(document.getElementById('goTank'))document.getElementById('goTank').onclick=()=>{tab='tanques';render()}}
function tankView(){const c=document.getElementById('content'),p=perms();if(!tanks.length)return c.innerHTML='<div class="card">No hay tanques activos.</div>';const t=tanks.find(x=>Number(x.id)===Number(tankId))||tanks[0],cal=calibrated(t);c.innerHTML=`<div class="card"><div class="section">Selecciona tanque</div><div class="grid g3">${tanks.map(x=>`<div class="tank ${Number(x.id)===Number(t.id)?'active':''}" data-tank="${x.id}"><b>${esc(x.name)}</b><div class="small">${num(x.capacity_liters)} L</div></div>`).join('')}</div></div><div class="card"><div class="row between"><div><div class="small muted">${esc(t.name)}</div><b>${geoName(t)}</b></div><span class="pill">${cal?'CALIBRADO':'DIRECTO'}</span></div><div style="height:12px"></div><label class="small muted">${cal?'Altura del líquido (cm)':'Litros medidos'}</label><input id="measure" class="input" type="number" min="0" step=".5"><div style="height:12px"></div><div class="small muted">LITROS CALCULADOS</div><div class="big"><span id="liters">0</span> <span style="font-size:20px;color:var(--green)">L</span></div><div class="bar"><div id="fill" class="fill"></div></div><div id="pct" class="small muted"></div></div><div class="card"><div class="section">Guardar movimiento</div><label class="small muted">Fecha y hora del movimiento</label><input id="occurredAt" class="input" type="datetime-local"><div class="small muted" style="margin-top:5px">Puedes capturar entregas anteriores; el corte usará esta fecha.</div><div style="height:10px"></div><label class="small muted">Tipo</label><select id="type" class="input">${p.measure?'<option value="measurement">Medición / llenado</option>':''}${p.withdraw?'<option value="withdrawal">Retiro / entrega al pipero</option>':''}</select><div id="withdrawBox" class="hidden"><div style="height:10px"></div><label class="small muted">Litros reales retirados</label><input id="withdraw" class="input" type="number" min="0" step="1" placeholder="Captura directamente los litros que se llevó"><div class="notice" style="margin-top:8px">Para entregas anteriores no necesitas reconstruir la altura: usa los litros reales del retiro.</div></div><div style="height:10px"></div><input id="notes" class="input" placeholder="Observación (opcional)"><div style="height:12px"></div><button id="saveMove" class="btn green" style="width:100%">GUARDAR MOVIMIENTO</button></div>`;document.querySelectorAll('[data-tank]').forEach(b=>b.onclick=()=>{tankId=b.dataset.tank;tankView()});const measure=document.getElementById('measure'),type=document.getElementById('type'),wb=document.getElementById('withdrawBox'),wi=document.getElementById('withdraw');function calc(){const liters=Math.min(Number(t.capacity_liters)||Infinity,tankLiters(t,measure.value));document.getElementById('liters').textContent=num(Math.round(liters));const pct=Math.max(0,Math.min(100,liters/Number(t.capacity_liters)*100));document.getElementById('fill').style.width=pct+'%';document.getElementById('pct').textContent=pct.toFixed(1)+'% de capacidad';return liters}measure.oninput=calc;type.onchange=()=>wb.classList.toggle('hidden',type.value!=='withdrawal');type.onchange();calc();const occurredAt=document.getElementById('occurredAt');{const d=new Date(),pad=n=>String(n).padStart(2,'0');occurredAt.value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;}document.getElementById('saveMove').onclick=async()=>{const isW=type.value==='withdrawal',liters=Math.round(isW?Number(wi.value||0):calc());if(liters<=0)return alert('Captura una cantidad válida.');const localDate=occurredAt.value;if(!localDate)return alert('Selecciona la fecha y hora del movimiento.');const occurred_at=new Date(localDate).toISOString();const {error}=await sb.from('movements').insert({tank_id:t.id,movement_type:type.value,liters,operator_name:currentProfile.display_name,notes:document.getElementById('notes').value.trim()||null,user_id:currentUser.id,occurred_at});if(error)return alert('No se pudo guardar: '+error.message);alert('Movimiento guardado.');measure.value='';if(wi)wi.value='';calc()}}
async function getMovements(){let q=sb.from('movements').select('id,tank_id,movement_type,liters,operator_name,notes,occurred_at,user_id').order('occurred_at',{ascending:false}).limit(500);const p=perms();if(!(p.view_all||currentProfile.role==='admin'))q=q.eq('user_id',currentUser.id);return await q}
async function historyView(){const c=document.getElementById('content');c.innerHTML='<div class="card">Cargando movimientos...</div>';const {data,error}=await getMovements();if(error)return c.innerHTML=`<div class="card err">${esc(error.message)}</div>`;const p=perms();c.innerHTML=`${reportHead('Historial de movimientos')}<div class="card"><div class="row between"><div class="section">${p.view_all||currentProfile.role==='admin'?'Historial general':'Mis movimientos'}</div><div class="reportbar no-print">${p.export?'<button id="xlsx" class="btn dark mini">EXCEL</button><button id="pdf" class="btn dark mini">PDF</button>':''}</div></div><div class="scroll"><table><thead><tr><th>Fecha</th><th>Tanque</th><th>Tipo</th><th>Litros</th><th>Usuario</th><th class="no-print">Acciones</th></tr></thead><tbody>${(data||[]).map(r=>`<tr><td>${new Date(r.occurred_at).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'})}</td><td>${r.tank_id}</td><td>${r.movement_type==='withdrawal'?'Retiro':'Medición'}</td><td>${num(r.liters)}</td><td>${esc(r.operator_name)}${r.notes?`<br><span class="muted">${esc(r.notes)}</span>`:''}</td><td class="no-print"><div class="actions">${p.edit_movements?`<button class="btn dark mini" data-edit="${r.id}">Editar</button>`:''}${p.delete_movements?`<button class="btn danger mini" data-del="${r.id}">Borrar</button>`:''}</div></td></tr>`).join('')}</tbody></table></div></div>`;document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Borrar este movimiento? Esta acción no se puede deshacer.'))return;const {error}=await sb.from('movements').delete().eq('id',b.dataset.del);if(error)return alert(error.message);historyView()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editMovement((data||[]).find(x=>String(x.id)===String(b.dataset.edit))));if(document.getElementById('xlsx'))document.getElementById('xlsx').onclick=()=>exportMovementsExcel(data||[]);if(document.getElementById('pdf'))document.getElementById('pdf').onclick=()=>window.print()}
function editMovement(r){const d=new Date(r.occurred_at),pad=n=>String(n).padStart(2,'0'),local=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;modal.classList.remove('hidden');modal.innerHTML=`<div class="sheet"><div class="row between"><div class="section">Editar movimiento #${r.id}</div><button id="closeModal" class="btn dark mini">Cerrar</button></div><label class="small muted">Fecha y hora</label><input id="editDate" class="input" type="datetime-local" value="${local}"><div style="height:8px"></div><label class="small muted">Tanque</label><select id="editTank" class="input">${tanks.map(t=>`<option value="${t.id}" ${Number(t.id)===Number(r.tank_id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select><div style="height:8px"></div><label class="small muted">Tipo</label><select id="editType" class="input"><option value="measurement" ${r.movement_type==='measurement'?'selected':''}>Medición / llenado</option><option value="withdrawal" ${r.movement_type==='withdrawal'?'selected':''}>Retiro / entrega</option></select><div style="height:8px"></div><label class="small muted">Litros</label><input id="editLiters" class="input" type="number" value="${Number(r.liters)}"><div style="height:8px"></div><label class="small muted">Observación</label><input id="editNotes" class="input" value="${esc(r.notes||'')}"><div style="height:12px"></div><button id="saveEdit" class="btn green" style="width:100%">GUARDAR CAMBIOS</button></div>`;document.getElementById('closeModal').onclick=()=>modal.classList.add('hidden');document.getElementById('saveEdit').onclick=async()=>{const liters=Math.round(Number(document.getElementById('editLiters').value)||0),dateValue=document.getElementById('editDate').value;if(liters<=0)return alert('Litros inválidos.');if(!dateValue)return alert('Selecciona fecha y hora.');const row={liters,notes:document.getElementById('editNotes').value.trim()||null,occurred_at:new Date(dateValue).toISOString(),tank_id:Number(document.getElementById('editTank').value),movement_type:document.getElementById('editType').value};const {error}=await sb.from('movements').update(row).eq('id',r.id);if(error)return alert(error.message);modal.classList.add('hidden');historyView()}}
function exportMovementsExcel(rows){const data=rows.map(r=>({Fecha:new Date(r.occurred_at).toLocaleString('es-MX'),Tanque:r.tank_id,Tipo:r.movement_type==='withdrawal'?'Retiro':'Medición',Litros:Number(r.liters),Usuario:r.operator_name,Observacion:r.notes||''}));const ws=XLSX.utils.json_to_sheet(data),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Movimientos');XLSX.writeFile(wb,'Quesos_Los_Sauces_Movimientos.xlsx')}
async function loadMonthData(key){const {start,next}=monthRange(key);const [mr,ar]=await Promise.all([sb.from('movements').select('id,tank_id,liters,occurred_at,operator_name,notes').eq('movement_type','withdrawal').gte('occurred_at',start.toISOString()).lt('occurred_at',next.toISOString()).order('occurred_at'),sb.from('monthly_adjustments').select('*').eq('period_start',start.toISOString().slice(0,10)).order('created_at')]);return {moves:mr.data||[],moveError:mr.error,adjustments:ar.data||[],adjError:ar.error,start,next}}
function adjustmentValue(a,liters){return a.calculation_type==='per_liter'?Number(a.amount)*liters:Number(a.amount)}
function adjLabel(type){return type==='bonus'?'Bono':type==='rejection'?'Rechazo':'Penalización'}
async function cutsView(){const c=document.getElementById('content');selectedMonth=selectedMonth||monthKey();const {moves,moveError,adjustments,adjError,start}=await loadMonthData(selectedMonth);if(moveError||adjError)return c.innerHTML=`<div class="card err">${esc((moveError||adjError).message)}</div>`;const liters=moves.reduce((a,r)=>a+Number(r.liters),0),base=liters*PRICE;let bonus=0,penalty=0,rejection=0;adjustments.forEach(a=>{const v=adjustmentValue(a,liters);if(a.adjustment_type==='bonus')bonus+=v;else if(a.adjustment_type==='rejection')rejection+=v;else penalty+=v});const total=base+bonus-penalty-rejection,pay=new Date(start.getFullYear(),start.getMonth()+1,5),p=perms();c.innerHTML=`${reportHead('Corte mensual • '+start.toLocaleDateString('es-MX',{month:'long',year:'numeric'}))}<div class="card no-print"><div class="monthline"><div class="grow"><label class="small muted">Mes del corte</label><input id="cutMonth" class="input" type="month" value="${selectedMonth}"></div>${p.export?'<button id="cutXlsx" class="btn dark mini">EXCEL</button><button id="cutPdf" class="btn dark mini">PDF</button>':''}</div></div><div class="card"><div class="section">Corte ${start.toLocaleDateString('es-MX',{month:'long',year:'numeric'})}</div><div class="grid g3"><div class="kpi">Litros vendidos<b>${num(liters)} L</b></div><div class="kpi">Base $${PRICE.toFixed(2)}/L<b>$${money(base)}</b></div><div class="kpi">Total final<b>$${money(total)}</b></div><div class="kpi">Bonos<b>$${money(bonus)}</b></div><div class="kpi">Penalizaciones<b>$${money(penalty)}</b></div><div class="kpi">Rechazos<b>$${money(rejection)}</b></div></div><div class="notice" style="margin-top:12px">Pago programado: <b>${pay.toLocaleDateString('es-MX')}</b> • Retiros: <b>${moves.length}</b></div></div><div class="card"><div class="row between"><div class="section">Bonos, penalizaciones y rechazos</div></div>${adjustments.length?`<div class="adjust-list">${adjustments.map(a=>`<div class="adjust-item"><div class="adjust-top"><div><div class="pill">${adjLabel(a.adjustment_type)}</div><div class="small muted" style="margin-top:5px">${a.calculation_type==='per_liter'?'Por litro':'Cantidad fija'}</div></div><div style="text-align:right"><div class="value-strong">${a.calculation_type==='per_liter'?'$'+money(a.amount)+'/L':'$'+money(a.amount)}</div><div class="small muted">Impacto $${money(adjustmentValue(a,liters))}</div></div></div>${a.reason?`<div class="notice" style="margin-top:8px"><b>Motivo:</b> ${esc(a.reason)}</div>`:''}<div class="adjust-actions no-print"><button class="btn dark mini" data-editadj="${a.id}">EDITAR</button><button class="btn danger mini" data-deladj="${a.id}">BORRAR</button></div></div>`).join('')}</div>`:'<div class="muted small">No hay ajustes registrados.</div>'}</div><div class="card no-print"><div class="section">Agregar ajuste</div><select id="adjType" class="input"><option value="bonus">Bono</option><option value="penalty">Penalización / descuento</option><option value="rejection">Rechazo</option></select><div style="height:8px"></div><select id="calcType" class="input"><option value="fixed">Cantidad fija ($)</option><option value="per_liter">Por litro ($/L)</option></select><div style="height:8px"></div><input id="adjAmount" class="input" type="number" step=".01" placeholder="Cantidad"><div style="height:8px"></div><input id="adjReason" class="input" placeholder="Motivo"><div style="height:10px"></div><button id="saveAdj" class="btn green" style="width:100%">GUARDAR AJUSTE</button></div>`;document.getElementById('cutMonth').onchange=e=>{selectedMonth=e.target.value;cutsView()};document.getElementById('saveAdj').onclick=async()=>{const amount=Number(document.getElementById('adjAmount').value)||0;if(amount<=0)return alert('Cantidad inválida.');const {error}=await sb.from('monthly_adjustments').insert({period_start:start.toISOString().slice(0,10),adjustment_type:document.getElementById('adjType').value,calculation_type:document.getElementById('calcType').value,amount,reason:document.getElementById('adjReason').value.trim()||null,created_by:currentUser.id});if(error)return alert(error.message);cutsView()};document.querySelectorAll('[data-deladj]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Borrar este bono, penalización o rechazo?'))return;const {error}=await sb.from('monthly_adjustments').delete().eq('id',b.dataset.deladj);if(error)return alert(error.message);cutsView()});document.querySelectorAll('[data-editadj]').forEach(b=>b.onclick=()=>editAdjustment(adjustments.find(a=>String(a.id)===String(b.dataset.editadj)),start));if(document.getElementById('cutXlsx'))document.getElementById('cutXlsx').onclick=()=>exportCutExcel(start,moves,adjustments,liters,base,bonus,penalty,rejection,total);if(document.getElementById('cutPdf'))document.getElementById('cutPdf').onclick=()=>window.print()}
function editAdjustment(a,start){modal.classList.remove('hidden');modal.innerHTML=`<div class="sheet"><div class="row between"><div class="section">Editar ajuste #${a.id}</div><button id="closeModal" class="btn dark mini">Cerrar</button></div><label class="small muted">Tipo</label><select id="eaType" class="input"><option value="bonus" ${a.adjustment_type==='bonus'?'selected':''}>Bono</option><option value="penalty" ${a.adjustment_type==='penalty'?'selected':''}>Penalización / descuento</option><option value="rejection" ${a.adjustment_type==='rejection'?'selected':''}>Rechazo</option></select><div style="height:8px"></div><label class="small muted">Cálculo</label><select id="eaCalc" class="input"><option value="fixed" ${a.calculation_type==='fixed'?'selected':''}>Cantidad fija</option><option value="per_liter" ${a.calculation_type==='per_liter'?'selected':''}>Por litro</option></select><div style="height:8px"></div><label class="small muted">Cantidad</label><input id="eaAmount" class="input" type="number" step=".01" value="${Number(a.amount)}"><div style="height:8px"></div><label class="small muted">Motivo</label><input id="eaReason" class="input" value="${esc(a.reason||'')}"><div style="height:12px"></div><button id="saveAdjEdit" class="btn green" style="width:100%">GUARDAR CAMBIOS</button></div>`;document.getElementById('closeModal').onclick=()=>modal.classList.add('hidden');document.getElementById('saveAdjEdit').onclick=async()=>{const amount=Number(document.getElementById('eaAmount').value)||0;if(amount<=0)return alert('Cantidad inválida.');const row={adjustment_type:document.getElementById('eaType').value,calculation_type:document.getElementById('eaCalc').value,amount,reason:document.getElementById('eaReason').value.trim()||null};const {error}=await sb.from('monthly_adjustments').update(row).eq('id',a.id);if(error)return alert(error.message);modal.classList.add('hidden');cutsView()}}
function exportCutExcel(start,moves,adjustments,liters,base,bonus,penalty,rejection,total){const wb=XLSX.utils.book_new();const summary=[{Empresa:COMPANY,Marca:BRAND,Periodo:start.toLocaleDateString('es-MX',{month:'long',year:'numeric'}),'Litros vendidos':liters,'Precio por litro':PRICE,'Importe base':base,Bonos:bonus,Penalizaciones:penalty,Rechazos:rejection,'Total final':total}];XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summary),'Resumen');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(moves.map(r=>({Fecha:new Date(r.occurred_at).toLocaleString('es-MX'),Tanque:r.tank_id,Litros:Number(r.liters),Usuario:r.operator_name,Observacion:r.notes||''}))),'Retiros');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(adjustments.map(a=>({Tipo:adjLabel(a.adjustment_type),Calculo:a.calculation_type==='per_liter'?'Por litro':'Fijo',Cantidad:Number(a.amount),Motivo:a.reason||'',Impacto:adjustmentValue(a,liters)}))),'Ajustes');XLSX.writeFile(wb,`Quesos_Los_Sauces_Corte_${selectedMonth}.xlsx`)}
async function statsView(){const c=document.getElementById('content');selectedMonth=selectedMonth||monthKey();const {moves,moveError,adjustments,adjError,start}=await loadMonthData(selectedMonth);if(moveError||adjError)return c.innerHTML=`<div class="card err">${esc((moveError||adjError).message)}</div>`;const liters=moves.reduce((a,r)=>a+Number(r.liters),0),byDay={};moves.forEach(r=>{const k=new Date(r.occurred_at).toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit'});byDay[k]=(byDay[k]||0)+Number(r.liters)});const days=Object.entries(byDay).sort((a,b)=>{const [da,ma]=a[0].split('/').map(Number),[db,mb]=b[0].split('/').map(Number);return ma-mb||da-db});const max=Math.max(0,...days.map(x=>x[1])),best=days.reduce((a,x)=>!a||x[1]>a[1]?x:a,null);let bonus=0,penalty=0,rejection=0;adjustments.forEach(a=>{const v=adjustmentValue(a,liters);if(a.adjustment_type==='bonus')bonus+=v;else if(a.adjustment_type==='rejection')rejection+=v;else penalty+=v});const net=liters*PRICE+bonus-penalty-rejection;c.innerHTML=`${reportHead('Estadísticas • '+start.toLocaleDateString('es-MX',{month:'long',year:'numeric'}))}<div class="card no-print"><div class="monthline"><div class="grow"><label class="small muted">Mes</label><input id="statMonth" class="input" type="month" value="${selectedMonth}"></div><button id="statXlsx" class="btn dark mini">EXCEL</button><button id="statPdf" class="btn dark mini">PDF</button></div></div><div class="card"><div class="section">Resumen mensual</div><div class="grid g3"><div class="kpi">Litros vendidos<b>${num(liters)} L</b></div><div class="kpi">Retiros<b>${moves.length}</b></div><div class="kpi">Promedio/retiro<b>${num(moves.length?liters/moves.length:0)} L</b></div><div class="kpi">Mejor día<b>${best?best[0]:'—'}</b></div><div class="kpi">Litros mejor día<b>${best?num(best[1])+' L':'—'}</b></div><div class="kpi">Total neto<b>$${money(net)}</b></div><div class="kpi">Bonos<b>$${money(bonus)}</b></div><div class="kpi">Penalizaciones<b>$${money(penalty)}</b></div><div class="kpi">Rechazos<b>$${money(rejection)}</b></div></div></div><div class="card"><div class="section">Litros retirados por día</div>${days.length?days.map(([d,l])=>`<div class="statrow"><div class="small">${d}</div><div class="statbar"><div class="statfill" style="width:${max?Math.max(2,l/max*100):0}%"></div></div><div class="small" style="text-align:right">${num(l)} L</div></div>`).join(''):'<div class="muted small">No hay retiros en este mes.</div>'}</div><div class="card"><div class="section">Ajustes del mes</div><div class="grid g3"><div class="kpi">Bonos registrados<b>${adjustments.filter(a=>a.adjustment_type==='bonus').length}</b></div><div class="kpi">Penalizaciones<b>${adjustments.filter(a=>a.adjustment_type==='penalty').length}</b></div><div class="kpi">Rechazos<b>${adjustments.filter(a=>a.adjustment_type==='rejection').length}</b></div></div></div>`;document.getElementById('statMonth').onchange=e=>{selectedMonth=e.target.value;statsView()};document.getElementById('statPdf').onclick=()=>window.print();document.getElementById('statXlsx').onclick=()=>{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([{Periodo:start.toLocaleDateString('es-MX',{month:'long',year:'numeric'}),Litros:liters,Retiros:moves.length,'Mejor día':best?.[0]||'','Litros mejor día':best?.[1]||0,Bonos:bonus,Penalizaciones:penalty,Rechazos:rejection,'Total neto':net}]),'Resumen');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(days.map(([Dia,Litros])=>({Dia,Litros}))),'Por día');XLSX.writeFile(wb,`Quesos_Los_Sauces_Estadisticas_${selectedMonth}.xlsx`)}}
async function adminView(){const c=document.getElementById('content'),p=perms();c.innerHTML='<div class="card">Cargando administración...</div>';const {data:users}=await sb.from('app_users').select('*').order('display_name');let html='';if(p.manage_users)html+=`<div class="card"><div class="section">Permisos por trabajador</div>${(users||[]).filter(u=>u.id!==currentUser.id).map(u=>{const up=u.permissions||{};return `<div class="card" style="margin-top:8px"><div class="row between"><div><b>${esc(u.display_name)}</b><div class="small muted">${esc(u.username)} • ${esc(u.role)}</div></div><button class="btn ${u.active?'danger':'dark'} mini" data-active="${u.id}" data-state="${u.active?'0':'1'}">${u.active?'Desactivar':'Activar'}</button></div><div class="permgrid" style="margin-top:8px">${[['measure','Mediciones'],['withdraw','Retiros'],['view_all','Ver todo'],['edit_movements','Editar movimientos'],['delete_movements','Borrar movimientos'],['export','Exportar'],['finance','Ver finanzas'],['manage_tanks','Administrar tanques']].map(([k,l])=>`<label class="check"><input type="checkbox" data-perm="${u.id}" data-key="${k}" ${up[k]?'checked':''}> ${l}</label>`).join('')}</div><button class="btn dark mini" style="margin-top:8px" data-saveperm="${u.id}">Guardar permisos</button></div>`}).join('')}</div>`;if(p.manage_tanks)html+=`<div class="card"><div class="section">Tanques y fórmulas</div>${tanks.map(t=>`<div class="row between" style="padding:9px 0;border-bottom:1px solid #ffffff10"><div><b>${esc(t.name)}</b><div class="small muted">${num(t.capacity_liters)} L • ${geoName(t)}${t.diameter_cm?` • Ø ${t.diameter_cm} cm`:''}${t.length_cm?` • Largo ${t.length_cm} cm`:''}</div></div><button class="btn dark mini" data-edittank="${t.id}">Editar</button></div>`).join('')}<div style="height:12px"></div><button id="newTank" class="btn green" style="width:100%">AGREGAR TANQUE</button></div>`;html+=`<div class="card"><div class="section">Identidad de empresa</div><div class="brandline"><img src="logo.jpg" style="width:90px;height:90px;object-fit:cover;border-radius:14px;background:#fff"><div><b>${BRAND}</b><div class="small muted">${COMPANY}</div><div class="tiny muted">Esta identidad se usa en pantalla y reportes PDF/Excel.</div></div></div></div><div class="card"><div class="section">Mi contraseña</div><input id="newPass" class="input" type="password" placeholder="Nueva clave"><div style="height:10px"></div><button id="changeMine" class="btn dark" style="width:100%">CAMBIAR MI CONTRASEÑA</button></div>`;c.innerHTML=html;document.querySelectorAll('[data-active]').forEach(b=>b.onclick=async()=>{const {data,error}=await sb.functions.invoke('admin-users',{body:{action:'set_active',id:b.dataset.active,active:b.dataset.state==='1'}});if(error||data?.error)return alert(error?.message||data.error);adminView()});document.querySelectorAll('[data-saveperm]').forEach(b=>b.onclick=async()=>{const id=b.dataset.saveperm,obj={};document.querySelectorAll(`[data-perm="${id}"]`).forEach(x=>obj[x.dataset.key]=x.checked);const {error}=await sb.from('app_users').update({permissions:obj}).eq('id',id);if(error)return alert(error.message);alert('Permisos guardados.')});document.querySelectorAll('[data-edittank]').forEach(b=>b.onclick=()=>tankEditor(tanks.find(t=>String(t.id)===b.dataset.edittank)));if(document.getElementById('newTank'))document.getElementById('newTank').onclick=()=>tankEditor(null);document.getElementById('changeMine').onclick=async()=>{const password=document.getElementById('newPass').value;if(password.length<8)return alert('Mínimo 8 caracteres.');const {data,error}=await sb.functions.invoke('admin-users',{body:{action:'change_password',id:currentUser.id,password}});if(error||data?.error)return alert(error?.message||data.error);alert('Contraseña actualizada.')}}
function tankEditor(t){modal.classList.remove('hidden');modal.innerHTML=`<div class="sheet"><div class="row between"><div class="section">${t?'Editar':'Nuevo'} tanque</div><button id="closeModal" class="btn dark mini">Cerrar</button></div><input id="tn" class="input" placeholder="Nombre" value="${esc(t?.name||'')}"><div style="height:8px"></div><input id="tc" class="input" type="number" placeholder="Capacidad en litros" value="${t?.capacity_liters||''}"><div style="height:8px"></div><select id="tg" class="input"><option value="direct" ${t?.geometry_type==='direct'?'selected':''}>Captura directa</option><option value="horizontal_cylinder" ${t?.geometry_type==='horizontal_cylinder'?'selected':''}>Pipa / cilindro horizontal</option><option value="vertical_cylinder" ${t?.geometry_type==='vertical_cylinder'?'selected':''}>Cilíndrico vertical</option></select><div style="height:8px"></div><input id="td" class="input" type="number" step=".1" placeholder="Diámetro (cm)" value="${t?.diameter_cm||''}"><div style="height:8px"></div><input id="tl" class="input" type="number" step=".1" placeholder="Largo (cm) — para pipa" value="${t?.length_cm||''}"><div style="height:8px"></div><input id="th" class="input" type="number" step=".1" placeholder="Altura total (cm)" value="${t?.height_cm||''}"><div style="height:8px"></div><input id="tnote" class="input" placeholder="Notas" value="${esc(t?.tank_notes||'')}"><div style="height:12px"></div><button id="saveTank" class="btn green" style="width:100%">GUARDAR TANQUE</button></div>`;document.getElementById('closeModal').onclick=()=>modal.classList.add('hidden');document.getElementById('saveTank').onclick=async()=>{const row={name:document.getElementById('tn').value.trim(),capacity_liters:Math.round(Number(document.getElementById('tc').value)||0),geometry_type:document.getElementById('tg').value,diameter_cm:Number(document.getElementById('td').value)||null,length_cm:Number(document.getElementById('tl').value)||null,height_cm:Number(document.getElementById('th').value)||null,tank_notes:document.getElementById('tnote').value.trim()||null,active:true};if(!row.name||row.capacity_liters<=0)return alert('Nombre y capacidad son obligatorios.');let error;if(t){({error}=await sb.from('tanks').update(row).eq('id',t.id))}else{const id=Math.max(0,...tanks.map(x=>Number(x.id)))+1;({error}=await sb.from('tanks').insert({...row,id}))}if(error)return alert(error.message);await loadTanks();modal.classList.add('hidden');adminView()}}
(async()=>{await bootstrapAdmin();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});const {data:{session}}=await sb.auth.getSession();if(session){currentUser=session.user;try{await loadProfile();await loadTanks();render()}catch(e){loginView()}}else loginView()})();
</script></body></html>
