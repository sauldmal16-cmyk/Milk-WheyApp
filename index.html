function monthRange(key){const [y,m]=key.split('-').map(Number),start=new Date(y,m-1,1),next=new Date(y,m,1);return {start,next,label:start.toLocaleDateString('es-MX',{month:'long',year:'numeric'})}}

function tankLiters(t,h){h=Number(h)||0;if(t.geometry_type==='horizontal_cylinder'&&t.diameter_cm&&t.length_cm){const D=Number(t.diameter_cm),L=Number(t.length_cm),R=D/2;if(h<=0)return 0;if(h>=D)return Math.PI*R*R*L/1000;const a=Math.acos((R-h)/R);return (R*R*a-(R-h)*Math.sqrt(Math.max(0,2*R*h-h*h)))*L/1000}if(t.geometry_type==='vertical_cylinder'&&t.diameter_cm){const r=Number(t.diameter_cm)/2;return Math.PI*r*r*Math.max(0,h)/1000}if(t.geometry_type==='tub'&&t.length_cm&&t.width_cm){return Math.max(0,Number(t.length_cm)*Number(t.width_cm)*Math.max(0,h)/1000)}return Math.max(0,Math.min(Number(t.capacity_liters)||0,h))}
function calibrated(t){return (t.geometry_type==='horizontal_cylinder'&&t.diameter_cm&&t.length_cm)||(t.geometry_type==='vertical_cylinder'&&t.diameter_cm)||(t.geometry_type==='tub'&&t.length_cm&&t.width_cm)}
function geoName(t){return t.geometry_type==='horizontal_cylinder'?'Cilindro horizontal':t.geometry_type==='vertical_cylinder'?'Cilíndrico vertical':t.geometry_type==='tub'?'Tina':'Captura directa'}
function tankIcon(t){return t.geometry_type==='horizontal_cylinder'?'horizontal':t.geometry_type==='vertical_cylinder'?'vertical':t.geometry_type==='tub'?'tub':'direct'}

function tankView(){const c=document.getElementById('content'),p=perms();if(!tanks.length)return c.innerHTML='<div class="card">No hay tanques activos.</div>';const allowed=[];if(p.measure)allowed.push(['measurement','Medición / llenado']);if(p.withdraw)allowed.push(['withdrawal','Retiro / entrega al pipero']);c.innerHTML=`<div class="card"><div class="row between"><div class="section" style="font-size:20px;margin:0">Nueva operación</div><span class="pill">1 Seleccionar · 2 Control previo · 3 Confirmar</span></div><div style="height:12px"></div><label class="small muted">TIPO DE OPERACIÓN</label><select id="opType" class="input">${allowed.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select><div style="height:10px"></div><label class="small muted">Fecha y hora</label><input id="opDate" class="input" type="datetime-local" value="${localNowValue()}"><div id="sealBox" class="hidden"><div style="height:10px"></div><label class="small muted">Folio / sello de carga del pipero</label><input id="loadSeal" class="input" inputmode="numeric" placeholder="Ej. 847365"><div class="tiny muted" style="margin-top:5px">Captura el número físico del sello o folio de carga.</div></div><div style="height:10px"></div><input id="opNotes" class="input" placeholder="Observación general (opcional)"></div><div class="card"><div class="section">Tanques de la operación</div><div class="small muted">Selecciona todos los tanques que participen. Cada tanque conserva su medición y control de calidad.</div><div id="opTanks" class="grid" style="margin-top:10px"></div></div><div class="card"><div class="small muted">TOTAL DE LA OPERACIÓN</div><div class="big"><span id="opTotal">0</span> <span style="font-size:20px;color:var(--green)">L</span></div><div class="notice" style="margin-top:10px">Al guardar se generará automáticamente un folio interno Milk-WheyApp.</div><button id="saveOperation" class="btn green" style="width:100%;margin-top:10px">GUARDAR OPERACIÓN</button></div>`;const type=document.getElementById('opType'),box=document.getElementById('opTanks'),sealBox=document.getElementById('sealBox');function draw(){const isW=type.value==='withdrawal';sealBox.classList.toggle('hidden',!isW);box.innerHTML=tanks.map(t=>{const cal=calibrated(t);return `<div class="adjust-item" style="border-radius:16px;padding:12px"><label class="check" style="cursor:pointer;border:0;background:transparent!important"><input type="checkbox" class="opPick" data-id="${t.id}"> ${tankShape(t,true)} <b>${esc(t.name)}</b>&nbsp;<span class="muted">${num(t.capacity_liters)} L · ${geoName(t)}</span></label><div class="opFields hidden" data-fields="${t.id}" style="margin-top:8px">${cal?`<label class="small muted">Forma de captura</label><select class="input opMode" data-id="${t.id}"><option value="height">Medir por altura (cm)</option>${isW?'<option value="direct">Litros directos</option>':''}</select><div style="height:7px"></div>`:''}<label class="small muted opLabel" data-label="${t.id}">${cal?'Altura del líquido (cm)':'Litros'}</label><input class="input opValue" data-id="${t.id}" type="number" min="0" step=".5" placeholder="${cal?'Altura en cm':'Litros'}"><div class="small muted" style="margin-top:5px">Resultado: <b><span class="opLiters" data-liters="${t.id}">0</span> L</b></div><div style="height:12px"></div><div class="section" style="font-size:13px">CONTROL PREVIO</div><div class="grid g3"><div><label class="small muted">Sólidos</label><input class="input opSolids" data-id="${t.id}" type="number" step=".01" placeholder="Sólidos"></div><div><label class="small muted">Acidez</label><input class="input opAcidity" data-id="${t.id}" type="number" step=".01" placeholder="Acidez"></div><div><label class="small muted">Temperatura °C</label><input class="input opTemp" data-id="${t.id}" type="number" step=".1" placeholder="°C"></div></div></div></div>`}).join('');document.querySelectorAll('.opPick').forEach(x=>x.onchange=()=>{document.querySelector(`[data-fields="${x.dataset.id}"]`).classList.toggle('hidden',!x.checked);calcTotal()});document.querySelectorAll('.opValue').forEach(x=>x.oninput=calcTotal);document.querySelectorAll('.opMode').forEach(x=>x.onchange=()=>{const id=x.dataset.id,lab=document.querySelector(`[data-label="${id}"]`),inp=document.querySelector(`.opValue[data-id="${id}"]`);lab.textContent=x.value==='height'?'Altura del líquido (cm)':'Litros directos';inp.placeholder=x.value==='height'?'Altura en cm':'Litros';calcTotal()});calcTotal()}function rowLiters(t){const pick=document.querySelector(`.opPick[data-id="${t.id}"]`);if(!pick?.checked)return 0;const inp=document.querySelector(`.opValue[data-id="${t.id}"]`),mode=document.querySelector(`.opMode[data-id="${t.id}"]`);let l=(calibrated(t)&&(!mode||mode.value==='height'))?tankLiters(t,inp.value):Number(inp.value||0);l=Math.max(0,Math.min(Number(t.capacity_liters)||Infinity,l));document.querySelector(`[data-liters="${t.id}"]`).textContent=num(Math.round(l));return Math.round(l)}function calcTotal(){let total=0;tanks.forEach(t=>total+=rowLiters(t));document.getElementById('opTotal').textContent=num(total);return total}type.onchange=draw;draw();document.getElementById('saveOperation').onclick=async()=>{const picked=tanks.filter(t=>document.querySelector(`.opPick[data-id="${t.id}"]`)?.checked);if(!picked.length)return alert('Selecciona al menos un tanque.');const rows=picked.map(t=>({t,liters:rowLiters(t)}));if(rows.some(r=>r.liters<=0))return alert('Captura una cantidad válida en todos los tanques seleccionados.');const date=document.getElementById('opDate').value;if(!date)return alert('Selecciona fecha y hora.');const isW=type.value==='withdrawal',load_seal=isW?document.getElementById('loadSeal').value.trim():null;if(isW&&!load_seal)return alert('Captura el folio / sello de carga del pipero.');const {data:folio,error:folioErr}=await sb.rpc('next_operation_folio');if(folioErr||!folio)return alert('No se pudo generar el folio interno: '+(folioErr?.message||'Error'));const op=operationId(),notes=document.getElementById('opNotes').value.trim()||null,occurred_at=new Date(date).toISOString(),payload=rows.map(r=>({tank_id:r.t.id,movement_type:type.value,liters:r.liters,solids:Number(document.querySelector(`.opSolids[data-id="${r.t.id}"]`)?.value||0)||null,acidity:Number(document.querySelector(`.opAcidity[data-id="${r.t.id}"]`)?.value||0)||null,temperature_c:Number(document.querySelector(`.opTemp[data-id="${r.t.id}"]`)?.value||0)||null,operator_name:currentProfile.display_name,notes,user_id:currentUser.id,occurred_at,operation_id:op,internal_folio:folio,load_seal}));const {error}=await sb.from('movements').insert(payload);if(error)return alert('No se pudo guardar: '+error.message);const savedOp={id:op,rows:payload,date:new Date(occurred_at),type:type.value,total:rows.reduce((a,r)=>a+r.liters,0),user:currentProfile.display_name,notes,internal_folio:folio,load_seal};if(confirm(`Operación guardada\\nFolio: ${folio}\\nTotal: ${num(savedOp.total)} L\\n\\n¿Compartir comprobante?`))shareOperationCard(savedOp);draw();document.getElementById('opNotes').value='';if(document.getElementById('loadSeal'))document.getElementById('loadSeal').value=''}}

async function historyView(){const c=document.getElementById('content'),p=perms();c.innerHTML='<div class="card">Cargando historial...</div>';const {data,error}=await getMovements();if(error)return c.innerHTML=`<div class="card err">${esc(error.message)}</div>`;const rows=data||[],now=new Date(),years=[...new Set(rows.map(r=>new Date(r.occurred_at).getFullYear()).concat([now.getFullYear()]))].sort((a,b)=>b-a);const savedYear=Number(window.histYear||now.getFullYear()),savedMonth=Number(window.histMonth||now.getMonth()+1);window.histYear=savedYear;window.histMonth=savedMonth;const filtered=rows.filter(r=>{const d=new Date(r.occurred_at);return d.getFullYear()===savedYear&&(d.getMonth()+1)===savedMonth});const groups={};filtered.forEach(r=>{const key=r.operation_id||('mov-'+r.id);(groups[key]??=[]).push(r)});const ops=Object.entries(groups).map(([id,rs])=>({id,rows:rs,date:new Date(rs[0].occurred_at),type:rs[0].movement_type,total:rs.reduce((a,x)=>a+Number(x.liters),0),user:rs[0].operator_name,notes:rs[0].notes||'',internal_folio:rs[0].internal_folio||'',load_seal:rs[0].load_seal||''})).sort((a,b)=>b.date-a.date);const total=ops.reduce((a,o)=>a+o.total,0),withdraw=ops.filter(o=>o.type==='withdrawal').reduce((a,o)=>a+o.total,0),measure=ops.filter(o=>o.type==='measurement').reduce((a,o)=>a+o.total,0);const monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];c.innerHTML=`${reportHead('Historial • '+monthNames[savedMonth-1]+' '+savedYear)}<div class="card no-print"><div class="section">Historial por mes y año</div><div class="grid g2"><div><label class="small muted">Año</label><select id="histYear" class="input">${years.map(y=>`<option value="${y}" ${y===savedYear?'selected':''}>${y}</option>`).join('')}</select></div><div><label class="small muted">Mes</label><select id="histMonth" class="input">${monthNames.map((m,i)=>`<option value="${i+1}" ${i+1===savedMonth?'selected':''}>${m}</option>`).join('' async function operationCardBlob(o){const W=1080,H=1350,canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');const bg='#eef2ee',dark='#203027',green='#7fa88b',muted='#66756b',white='#ffffff';ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.fillStyle=dark;ctx.fillRect(0,0,W,220);const drawRound=(x,y,w,h,r,fill)=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill()};let logo=null;try{logo=await new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src='logo.jpg'})}catch(e){}if(logo){ctx.save();ctx.beginPath();ctx.roundRect(55,38,145,145,28);ctx.clip();ctx.fillStyle=white;ctx.fillRect(55,38,145,145);ctx.drawImage(logo,55,38,145,145);ctx.restore()}drawRound(850,48,150,120,28,green);ctx.fillStyle=white;ctx.font='900 52px system-ui';ctx.textAlign='center';ctx.fillText('M-W',925,123);ctx.textAlign='left';ctx.fillStyle=white;ctx.font='900 46px system-ui';ctx.fillText('Quesos Los Sauces',230,92);ctx.font='700 25px system-ui';ctx.fillStyle='#d8e2da';ctx.fillText('Milk-WheyApp • Comprobante de operación',230,137);const date=o.date instanceof Date?o.date:new Date(o.rows?.[0]?.occurred_at||Date.now()),type=o.type||o.rows?.[0]?.movement_type,total=o.total??(o.rows||[]).reduce((a,r)=>a+Number(r.liters),0),user=o.user||o.rows?.[0]?.operator_name||'',notes=o.notes||o.rows?.[0]?.notes||'';drawRound(55,265,970,165,28,white);ctx.fillStyle=muted;ctx.font='700 25px system-ui';ctx.fillText('TIPO DE OPERACIÓN',85,310);ctx.fillStyle=dark;ctx.font='900 38px system-ui';ctx.fillText(type==='withdrawal'?'Retiro / entrega al pipero':'Medición / llenado',85,358);ctx.fillStyle=muted;ctx.font='600 24px system-ui';ctx.fillText(date.toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'}),85,400);let y=475;ctx.fillStyle=muted;ctx.font='800 24px system-ui';ctx.fillText('DETALLE POR TANQUE',65,y);y+=38;for(const r of (o.rows||[])){const t=tanks.find(t=>Number(t.id)===Number(r.tank_id));drawRound(5 async function shareOperationCard(o){try{const blob=await operationCardBlob(o),file=new File([blob],'Milk-WheyApp_Operacion.png',{type:'image/png'}),msg=operationShareText(o);if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){await navigator.share({title:'Milk-WheyApp',text:msg,files:[file]});return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Milk-WheyApp_Operacion.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);alert('Se guardó la ficha como imagen. Ya puedes compartirla por WhatsApp.')}catch(e){if(e?.name!=='AbortError')alert('No se pudo compartir la ficha: '+(e?.message||e))}}

function editOperation(o){const rs=o.rows||[];if(!rs.length)return;const d=new Date(rs[0].occurred_at),pad=n=>String(n).padStart(2,'0'),local=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;modal.classList.remove('hidden');modal.innerHTML=`<div class="sheet"><div class="row between"><div class="section">Editar operación</div><button id="closeModal" class="btn dark mini">Cerrar</button></div><label class="small muted">Fecha y hora</label><input id="opEditDate" class="input" type="datetime-local" value="${local}"><div style="height:8px"></div><label class="small muted">Tipo</label><select id="opEditType" class="input"><option value="measurement" ${rs[0].movement_type==='measurement'?'selected':''}>Medición / llenado</option><option value="withdrawal" ${rs[0].movement_type==='withdrawal'?'selected':''}>Retiro / entrega al pipero</option></select><div style="height:8px"></div><label class="small muted">Observación</label><input id="opEditNotes" class="input" value="${esc(rs[0].notes||'')}"><div style="height:12px"></div><div class="section">Detalle por tanque</div>${rs.map((r,i)=>`<div class="adjust-item" style="margin-bottom:9px"><label class="small muted">Tanque</label><select class="input opEditTank" data-row="${i}">${tanks.map(t=>`<option value="${t.id}" ${Number(t.id)===Number(r.tank_id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select><div style="height:7px"></div><label class="small muted">Litros</label><input class="input opEditLiters" data-row="${i}" type="number" min="0" step="1" value="${Number(r.liters)}"></div>`).join('')}<div class="notice">Al editar una operación se conserva como una sola operación. Puedes cambiar fecha, tipo, observación, tanque y litros de cada renglón.</div><div style="height:12px"></div><button id="saveOpEdit" class="btn green" style="width:100%">GUARDAR CAMBIOS</button></div>`;document.getElementById('closeModal').onclick=()=>modal.classList.add('hidden');document. function exportMovementsExcel(rows){const data=rows.map(r=>({Fecha:new Date(r.occurred_at).toLocaleString('es-MX'),Tanque:r.tank_id,Tipo:r.movement_type==='withdrawal'?'Retiro':'Medición',Litros:Number(r.liters),Usuario:r.operator_name,Observacion:r.notes||''}));const ws=XLSX.utils.json_to_sheet(data),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Movimientos');XLSX.writeFile(wb,'Quesos_Los_Sauces_Movimientos.xlsx')}
async function loadMonthData(key){const {start,next}=monthRange(key);const [mr,ar]=await Promise.all([sb.from('movements').select('id,tank_id,liters,occurred_at,operator_name,notes').eq('movement_type','withdrawal').gte('occurred_at',start.toISOString()).lt('occurred_at',next.toISOString()).order('occurred_at'),sb.from('monthly_adjustments').select('*').eq('period_start',start.toISOString().slice(0,10)).order('created_at')]);return {moves:mr.data||[],moveError:mr.error,adjustments:ar.data||[],adjError:ar.error,start,next}}
function adjustmentValue(a,liters){return a.calculation_type==='per_liter'?Number(a.amount)*liters:Number(a.amount)}
function adjLabel(type){return type==='bonus'?'Bono':type==='rejection'?'Rechazo':'Penalización'}
async function cutsView(){const c=document.getElementById('content');selectedMonth=selectedMonth||monthKey();const {moves,moveError,adjustments,adjError,start}=await loadMonthData(selectedMonth);if(moveError||adjError)return c.innerHTML=`<div class="card err">${esc((moveError||adjError).message)}</div>`;const liters=moves.reduce((a,r)=>a+Number(r.liters),0),base=liters*PRICE;let bonus=0,penalty=0,rejection=0;adjustments.forEach(a=>{const v=adjustmentValue(a,liters);if(a.adjustment_type==='bonus')bonus+=v;else if(a.adjustment_type==='rejection')rejection+=v;else penalty+=v});const total=base+bonus-penalty-rejection,pay=new Date(start.getFullYear(),start.getMonth()+1,5),p=perms();c.innerHTML=`${reportHead('Corte mensual • '+start.toLocaleDateString('es-MX',{month:'long',year:'numeric'}))}<div class="card no-print"><div class="monthline"><div class="grow"><label class="small muted">Mes del corte</label><input id="cutMonth" class="input" type="month" value="${selectedMonth}"></div>${p.export?'<button id="cutXlsx" class="btn dark mini">EXCEL</button><button id="cutPdf" class="btn dark mini">PDF</button>':''}</div></div><div class="card"><div class="section">Corte ${start.toLocaleDateString('es-MX',{month:'long',year:'numeric'})}</div><div class="grid g3"><div class="kpi">Litros vendidos<b>${num(liters)} L</b></div><div class="kpi">Base $${PRICE.toFixed(2)}/L<b>$${money(base)}</b></div><div class="kpi">Total final<b>$${money(total)}</b></div><div class="kpi">Bonos<b>$${money(bonus)}</b></div><div class="kpi">Penalizaciones<b>$${money(penalty)}</b></div><div class="kpi">Rechazos<b>$${money(rejection)}</b></div></div><div class="notice" style="margin-top:12px">Pago programado: <b>${pay.toLocaleDateString('es-MX')}</b> • Retiros: <b>${moves.length}</b></div></div><div class="card"><div class="row between"><div class="section">Bonos, penalizaciones y rechazos</div></div>${adjustments.length?`<div class="adjust-list">${adjustments.map(a=>`<div class="adjust-item"><div class="a function userEditor(u){modal.classList.remove('hidden');modal.innerHTML=`<div class="sheet"><div class="row between"><div class="section">Editar empleado</div><button id="closeModal" class="btn dark mini">Cerrar</button></div><label class="small muted">Nombre</label><input id="euName" class="input" value="${esc(u.display_name||'')}"><div style="height:8px"></div><label class="small muted">Usuario</label><input id="euUser" class="input" value="${esc(u.username||'')}"><div style="height:8px"></div><label class="small muted">Rol</label><select id="euRole" class="input"><option value="employee" ${u.role==='employee'?'selected':''}>Empleado</option><option value="pipero" ${u.role==='pipero'?'selected':''}>Pipero</option><option value="office" ${u.role==='office'?'selected':''}>Oficina</option><option value="admin" ${u.role==='admin'?'selected':''}>Administrador</option></select><div style="height:12px"></div><button id="saveUserEdit" class="btn green" style="width:100%">GUARDAR CAMBIOS</button></div>`;document.getElementById('closeModal').onclick=()=>modal.classList.add('hidden');document.getElementById('saveUserEdit').onclick=async()=>{const body={action:'edit_user',id:u.id,display_name:document.getElementById('euName').value.trim(),username:document.getElementById('euUser').value.trim().toLowerCase(),role:document.getElementById('euRole').value};if(!body.display_name||!body.username)return alert('Nombre y usuario son obligatorios.');const {data,error}=await sb.functions.invoke('admin-users',{body});if(error||data?.error)return alert(error?.message||data.error);modal.classList.add('hidden');alert('Empleado actualizado.');adminView()}}

function tankEditor(t){modal.classList.remove('hidden');modal.innerHTML=`<div class="sheet"><div class="row between"><div class="section">${t?'Editar':'Nuevo'} tanque</div><button id="closeModal" class="btn dark mini">Cerrar</button></div><label class="small muted">Nombre</label><input id="tn" class="input" placeholder="Ej. Tanque 04" value="${esc(t?.name||'')}"><div style="height:8px"></div><label class="small muted">Capacidad en litros</label><input id="tc" class="input" type="number" placeholder="Capacidad" value="${t?.capacity_liters||''}"><div style="height:8px"></div><label class="small muted">Forma del tanque</label><select id="tg" class="input"><option value="horizontal_cylinder" ${t?.geometry_type==='horizontal_cylinder'?'selected':''}>Tanque lechero horizontal</option><option value="vertical_cylinder" ${t?.geometry_type==='vertical_cylinder'?'selected':''}>🥫 Vertical</option><option value="tub" ${t?.geometry_type==='tub'?'selected':''}>🛁 Tina</option><option value="direct" ${t?.geometry_type==='direct'?'selected':''}>🥛 Captura directa</option></select><div id="shapeHelp" class="notice" style="margin-top:8px"></div><div style="height:8px"></div><input id="td" class="input" type="number" step=".1" placeholder="Diámetro (cm)" value="${t?.diameter_cm||''}"><div style="height:8px"></div><input id="tl" class="input" type="number" step=".1" placeholder="Largo (cm)" value="${t?.length_cm||''}"><div style="height:8px"></div><input id="tw" class="input" type="number" step=".1" placeholder="Ancho (cm) — para tina" value="${t?.width_cm||''}"><div style="height:8px"></div><input id="th" class="input" type="number" step=".1" placeholder="Altura total (cm)" value="${t?.height_cm||''}"><div style="height:8px"></div><input id="tnote" class="input" placeholder="Notas" value="${esc(t?.tank_notes||'')}"><div style="height:12px"></div><button id="saveTank" class="btn green" style="width:100%">GUARDAR TANQUE</button></div>`;const g=document.getElementById('tg'),help=document.getElementById('shapeHelp'),d=document.getElementById('td'),l=document.getElementById('tl'),w=document.getElementById('tw'),h=document.getElementById('th');function shapeUI(){const v=g.value;d.classList.toggle('hidden',v==='tub'||v==='direct');l.classList.toggle('hidden',v==='vertical_cylinder'||v==='direct');w.classList.toggle('hidden',v!=='tub');h.classList.toggle('hidden',v==='direct');help.innerHTML=v==='horizontal_cylinder'?'Tanque lechero horizontal: usa diámetro + largo; la lectura se captura por altura.':v==='vertical_cylinder'?'🥫 Vertical: usa diámetro; la lectura se captura por altura.':v==='tub'?'🛁 Tina: usa largo + ancho; la lectura se captura por altura.':'🥛 Captura directa: se registran litros sin fórmula.'}g.onchange=shapeUI;shapeUI();document.getElementById('closeModal').onclick=()=>modal.classList.add('hidden');document.getElementById('saveTank').onclick=async()=>{const row={name:document.getElementById('tn').value.trim(),capacity_liters:Math.round(Number(document.getElementById('tc').value)||0),geometry_type:g.value,diameter_cm:Number(d.value)||null,length_cm:Number(l.value)||null,width_cm:Number(w.value)||null,height_cm:Number(h.value)||null,tank_notes:document.getElementById('tnote').value.trim()||null,active:true};if(!row.name||row.capacity_liters<=0)return alert('Nombre y capacidad son obligatorios.');if(row.geometry_type==='horizontal_cylinder'&&(!row.diameter_cm||!row.length_cm))return alert('Para horizontal captura diámetro y largo.');if(row.geometry_type==='vertical_cylinder'&&!row.diameter_cm)return alert('Para vertical captura diámetro.');if(row.geometry_type==='tub'&&(!row.length_cm||!row.width_cm))return alert('Para tina captura largo y ancho.');let error;if(t){({error}=await sb.from('tanks').update(row).eq('id',t.id))}else{const id=Math.max(0,...tanks.map(x=>Number(x.id)))+1;({error}=await sb.from('tanks').insert({...row,id}))}if(error)return alert(error.message);await loadTanks();modal.classList.add('hidden');adminView()}}
(async()=>{await bootstrapAdmin();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});const {data:{session}}=await sb.auth.getSession();if(session){currentUser=session.user;try{await loadProfile();await loadTanks();render()}catch(e){loginView()}}else loginView()})();
</script></body></html>
