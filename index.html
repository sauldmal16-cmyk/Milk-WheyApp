<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Milk-WheyApp</title>
<style>
:root{--bg:#07100a;--panel:#101c14;--panel2:#0b1510;--line:#2d4936;--green:#20f58a;--text:#f4fff8;--muted:#91ad9a;--danger:#ff6b6b;--warn:#ffd166}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;padding:18px;background:#0d1710}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-size:22px;font-weight:900}.tag{font-size:11px;background:var(--green);color:#031008;border-radius:999px;padding:4px 8px;font-weight:900}
.muted{color:var(--muted)}.small{font-size:12px}.card{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:16px;margin-top:14px}
.input{width:100%;background:var(--panel2);color:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.btn{border:0;border-radius:14px;padding:12px 13px;font-weight:850}
.green{background:var(--green);color:#04110a}.dark{background:#1b2b20;color:#fff;border:1px solid rgba(255,255,255,.08)}.danger{background:#4c2020;color:#fff}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grid{display:grid;gap:10px}.g3{grid-template-columns:repeat(3,1fr)}
.tank{background:#17261b;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:12px;cursor:pointer}.tank.active{background:var(--green);color:#04110a}
.big{font-size:46px;font-weight:950;letter-spacing:-2px}.bar{height:15px;background:#1d2b21;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--green)}
.pill{display:inline-block;border-radius:999px;padding:6px 9px;background:#18271d;color:var(--green);font-size:11px;font-weight:850}
.notice{font-size:12px;line-height:1.5;background:#0b1510;border:1px solid rgba(32,245,138,.18);border-radius:14px;padding:12px}.warn{color:var(--warn)}.err{color:var(--danger)}
.section{font-weight:900;margin-bottom:10px}.hidden{display:none}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.tab{white-space:nowrap;border:0;background:#17261b;color:#cde0d3;padding:9px 11px;border-radius:12px;font-weight:800}.tab.active{background:var(--green);color:#04110a}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px 5px;border-bottom:1px solid rgba(255,255,255,.06)}th{color:var(--muted)}.scroll{max-height:360px;overflow:auto}
.kpi{font-size:12px;color:var(--muted)}.kpi b{display:block;color:#fff;font-size:18px;margin-top:3px}.login{padding-top:8vh}.logout{background:none;color:var(--muted);border:0;font-weight:800}
@media(max-width:390px){.g3{grid-template-columns:1fr}.big{font-size:40px}}
</style>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><style>
.actions{display:flex;gap:7px;flex-wrap:wrap}.mini{padding:7px 9px;border-radius:10px;font-size:11px}.permgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.check{display:flex;align-items:center;gap:7px;background:#0b1510;padding:9px;border-radius:12px;font-size:12px}.reportbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.modal{position:fixed;inset:0;background:#000b;z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(520px,100%);max-height:90vh;overflow:auto;background:#101c14;border-radius:24px 24px 0 0;padding:18px}.modal.hidden{display:none}@media print{body{background:#fff;color:#000}.app{max-width:none;background:#fff;color:#000}.top,.tabs,.no-print{display:none!important}.card{background:#fff;color:#000;border:1px solid #ccc}.muted{color:#555}table{font-size:10px}th,td{color:#000;border-color:#ddd}.kpi b{color:#000}}
</style></head>
<body><div id="app" class="app"></div><div id="modal" class="modal hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const SUPABASE_URL='https://lpruaeiadbmuktsosiur.supabase.co';
const SUPABASE_KEY='sb_publishable_eR96pHoE-uu5qLJECPTOUw_loScd0oo';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY); const PRICE=0.25;
let currentUser=null,currentProfile=null,tanks=[],tankId=1,tab='inicio'; const app=document.getElementById('app'),modal=document.getElementById('modal');
const esc=(s='')=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const num=n=>Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0}), money=n=>Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const ADMIN_PERMS={measure:true,withdraw:true,view_all:true,edit_movements:true,delete_movements:true,manage_tanks:true,manage_users:true,export:true,finance:true};
function perms(){if(currentProfile?.role==='admin')return ADMIN_PERMS;const p=currentProfile?.permissions||{};return {measure:p.measure??['employee','office'].includes(currentProfile?.role),withdraw:p.withdraw??currentProfile?.role==='pipero',view_all:!!p.view_all,edit_movements:!!p.edit_movements,delete_movements:!!p.delete_movements,manage_tanks:!!p.manage_tanks,manage_users:!!p.manage_users,export:!!p.export,finance:!!p.finance}}
function tankLiters(t,h){h=Number(h)||0;if(t.geometry_type==='horizontal_cylinder'&&t.diameter_cm&&t.length_cm){const D=Number(t.diameter_cm),L=Number(t.length_cm),R=D/2;if(h<=0)return 0;if(h>=D)return Math.PI*R*R*L/1000;const a=Math.acos((R-h)/R);return (R*R*a-(R-h)*Math.sqrt(Math.max(0,2*R*h-h*h)))*L/1000}if(t.geometry_type==='vertical_cylinder'&&t.diameter_cm){const r=Number(t.diameter_cm)/2;return Math.PI*r*r*Math.max(0,h)/1000}return Math.max(0,Math.min(Number(t.capacity_liters)||0,h))}
function calibrated(t){return (t.geometry_type==='horizontal_cylinder'&&t.diameter_cm&&t.length_cm)||(t.geometry_type==='vertical_cylinder'&&t.diameter_cm)}
function geoName(t){return t.geometry_type==='horizontal_cylinder'?'Pipa / cilindro horizontal':t.geometry_type==='vertical_cylinder'?'Cilíndrico vertical':'Captura directa'}
async function bootstrapAdmin(){try{await fetch(SUPABASE_URL+'/functions/v1/bootstrap-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'saul',display_name:'Saúl Administrador',password:'MilkWhey-2608!'})})}catch(e){}}
async function loadProfile(){const {data,error}=await sb.from('app_users').select('*').eq('id',currentUser.id).single();if(error)throw error;currentProfile=data}
async function loadTanks(){const {data,error}=await sb.from('tanks').select('*').eq('active',true).order('id');if(!error&&data){tanks=data;if(!tanks.some(t=>Number(t.id)===Number(tankId))&&tanks.length)tankId=tanks[0].id}}
async function login(){const username=document.getElementById('username').value.trim().toLowerCase(),password=document.getElementById('password').value;const {data,error}=await sb.auth.signInWithPassword({email:username+'@milk-wheyapp.local',password});if(error)return loginView('Usuario o contraseña incorrectos.');currentUser=data.user;await loadProfile();if(!currentProfile.active){await sb.auth.signOut();return loginView('Esta cuenta está desactivada.')}await loadTanks();render()}
function loginView(msg=''){app.innerHTML=`<div class="login"><div class="brand">Milk-WheyApp <span class="tag">ONLINE</span></div><p class="muted">Control de leche, suero y retiros Nestlé</p><div class="card"><div class="section">Iniciar sesión</div>${msg?`<p class="err small">${esc(msg)}</p>`:''}<label class="small muted">Usuario</label><input id="username" class="input" placeholder="Ej. saul"><div style="height:10px"></div><label class="small muted">Contraseña</label><input id="password" class="input" type="password"><div style="height:12px"></div><button id="enter" class="btn green" style="width:100%">ENTRAR</button></div></div>`;document.getElementById('enter').onclick=login;document.getElementById('password').onkeydown=e=>{if(e.key==='Enter')login()}}
async function render(){if(!currentProfile)return loginView();const p=perms(),tabs=[['inicio','Inicio']];if(p.measure||p.withdraw)tabs.push(['tanques','Tanques']);tabs.push(['historial','Movimientos']);if(p.finance)tabs.push(['cortes','Cortes']);if(p.manage_users||p.manage_tanks)tabs.push(['admin','Administración']);app.innerHTML=`<div class="top"><div><div class="brand">Milk-WheyApp <span class="tag">V5</span></div><div class="small muted">${esc(currentProfile.display_name)} • ${esc(currentProfile.role)}</div></div><button id="logout" class="logout">Salir</button></div><div class="card no-print"><div class="tabs">${tabs.map(([id,l])=>`<button class="tab ${tab===id?'active':''}" data-tab="${id}">${l}</button>`).join('')}</div></div><div id="content"></div>`;document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();currentUser=currentProfile=null;loginView()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});if(tab==='inicio')homeView();if(tab==='tanques')tankView();if(tab==='historial')historyView();if(tab==='cortes')cutsView();if(tab==='admin')adminView()}
function homeView(){const p=perms(),c=document.getElementById('content');c.innerHTML=`<div class="card"><div class="section">Bienvenido, ${esc(currentProfile.display_name)}</div><div class="notice">Permisos activos: ${[p.measure?'mediciones':'',p.withdraw?'retiros':'',p.export?'exportar':'',p.finance?'finanzas':''].filter(Boolean).join(' • ')||'consulta'}</div>${(p.measure||p.withdraw)?'<div style="height:12px"></div><button id="goTank" class="btn green" style="width:100%">REGISTRAR MOVIMIENTO</button>':''}</div><div class="card"><div class="section">Tanques activos</div><div class="grid g3">${tanks.map(t=>`<div class="tank"><b>${esc(t.name)}</b><div class="small muted">${num(t.capacity_liters)} L<br>${geoName(t)}</div></div>`).join('')}</div></div>`;if(document.getElementById('goTank'))document.getElementById('goTank').onclick=()=>{tab='tanques';render()}}
function tankView(){const c=document.getElementById('content'),p=perms();if(!tanks.length)return c.innerHTML='<div class="card">No hay tanques activos.</div>';const t=tanks.find(x=>Number(x.id)===Number(tankId))||tanks[0],cal=calibrated(t);c.innerHTML=`<div class="card"><div class="section">Selecciona tanque</div><div class="grid g3">${tanks.map(x=>`<div class="tank ${Number(x.id)===Number(t.id)?'active':''}" data-tank="${x.id}"><b>${esc(x.name)}</b><div class="small">${num(x.capacity_liters)} L</div></div>`).join('')}</div></div><div class="card"><div class="row between"><div><div class="small muted">${esc(t.name)}</div><b>${geoName(t)}</b></div><span class="pill">${cal?'CALIBRADO':'DIRECTO'}</span></div><div style="height:12px"></div><label class="small muted">${cal?'Altura del líquido (cm)':'Litros medidos'}</label><input id="measure" class="input" type="number" min="0" step=".5"><div style="height:12px"></div><div class="small muted">LITROS CALCULADOS</div><div class="big"><span id="liters">0</span> <span style="font-size:22px;color:var(--green)">L</span></div><div class="bar"><div id="fill" class="fill"></div></div><div id="pct" class="small muted"></div></div><div class="card"><div class="section">Guardar movimiento</div><label class="small muted">Fecha y hora del movimiento</label><input id="occurredAt" class="input" type="datetime-local"><div class="small muted" style="margin-top:5px">Puedes capturar entregas anteriores; el corte usará esta fecha.</div><div style="height:10px"></div><select id="type" class="input">${p.measure?'<option value="measurement">Medición / llenado</option>':''}${p.withdraw?'<option value="withdrawal">Retiro por pipero</option>':''}</select><div id="withdrawBox" class="hidden"><div style="height:10px"></div><label class="small muted">Litros que se lleva</label><input id="withdraw" class="input" type="number" min="0"></div><div style="height:10px"></div><input id="notes" class="input" placeholder="Observación (opcional)"><div style="height:12px"></div><button id="saveMove" class="btn green" style="width:100%">GUARDAR MOVIMIENTO</button></div>`;document.querySelectorAll('[data-tank]').forEach(b=>b.onclick=()=>{tankId=b.dataset.tank;tankView()});const measure=document.getElementById('measure'),type=document.getElementById('type'),wb=document.getElementById('withdrawBox'),wi=document.getElementById('withdraw');function calc(){const liters=Math.min(Number(t.capacity_liters)||Infinity,tankLiters(t,measure.value));document.getElementById('liters').textContent=num(Math.round(liters));const pct=Math.max(0,Math.min(100,liters/Number(t.capacity_liters)*100));document.getElementById('fill').style.width=pct+'%';document.getElementById('pct').textContent=pct.toFixed(1)+'% de capacidad';return liters}measure.oninput=calc;type.onchange=()=>wb.classList.toggle('hidden',type.value!=='withdrawal');type.onchange();calc();const occurredAt=document.getElementById('occurredAt');{const d=new Date(),pad=n=>String(n).padStart(2,'0');occurredAt.value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;}document.getElementById('saveMove').onclick=async()=>{const isW=type.value==='withdrawal',liters=Math.round(isW?Number(wi.value||0):calc());if(liters<=0)return alert('Captura una cantidad válida.');const localDate=occurredAt.value;if(!localDate)return alert('Selecciona la fecha y hora del movimiento.');const occurred_at=new Date(localDate).toISOString();const {error}=await sb.from('movements').insert({tank_id:t.id,movement_type:type.value,liters,operator_name:currentProfile.display_name,notes:document.getElementById('notes').value.trim()||null,user_id:currentUser.id,occurred_at});if(error)return alert('No se pudo guardar: '+error.message);alert('Movimiento guardado.');measure.value='';if(wi)wi.value='';calc()}}
async function getMovements(){let q=sb.from('movements').select('id,tank_id,movement_type,liters,operator_name,notes,occurred_at,user_id').order('occurred_at',{ascending:false}).limit(500);if(!perms().view_all&&currentProfile.role!=='admin')q=q.eq('user_id',currentUser.id);return await q}
async function historyView(){const c=document.getElementById('content');c.innerHTML='<div class="card">Cargando movimientos...</div>';const {data,error}=await getMovements();if(error)return c.innerHTML=`<div class="card err">${esc(error.message)}</div>`;const p=perms();c.innerHTML=`<div class="card"><div class="row between"><div class="section">${p.view_all||currentProfile.role==='admin'?'Historial general':'Mis movimientos'}</div><div class="reportbar no-print">${p.export?'<button id="xlsx" class="btn dark mini">EXCEL</button><button id="pdf" class="btn dark mini">PDF</button>':''}</div></div><div class="scroll"><table><thead><tr><th>Fecha</th><th>Tanque</th><th>Tipo</th><th>Litros</th><th>Usuario</th><th class="no-print">Acciones</th></tr></thead><tbody>${(data||[]).map(r=>`<tr><td>${new Date(r.occurred_at).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'})}</td><td>${r.tank_id}</td><td>${r.movement_type==='withdrawal'?'Retiro':'Medición'}</td><td>${num(r.liters)}</td><td>${esc(r.operator_name)}${r.notes?`<br><span class="muted">${esc(r.notes)}</span>`:''}</td><td class="no-print"><div class="actions">${p.edit_movements?`<button class="btn dark mini" data-edit="${r.id}">Editar</button>`:''}${p.delete_movements?`<button class="btn danger mini" data-del="${r.id}">Borrar</button>`:''}</div></td></tr>`).join('')}</tbody></table></div></div>`;document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Borrar este movimiento? Esta acción no se puede deshacer.'))return;const {error}=await sb.from('movements').delete().eq('id',b.dataset.del);if(error)return alert(error.message);historyView()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editMovement((data||[]).find(x=>String(x.id)===String(b.dataset.edit))));if(document.getElementById('xlsx'))document.getElementById('xlsx').onclick=()=>exportExcel(data||[]);if(document.getElementById('pdf'))document.getElementById('pdf').onclick=()=>window.print()}
function editMovement(r){const d=new Date(r.occurred_at),pad=n=>String(n).padStart(2,'0'),local=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;modal.classList.remove('hidden');modal.innerHTML=`<div class="sheet"><div class="row between"><div class="section">Editar movimiento #${r.id}</div><button id="closeModal" class="btn dark mini">Cerrar</button></div><label class="small muted">Fecha y hora del movimiento</label><input id="editDate" class="input" type="datetime-local" value="${local}"><div style="height:8px"></div><label class="small muted">Tanque</label><select id="editTank" class="input">${tanks.map(t=>`<option value="${t.id}" ${Number(t.id)===Number(r.tank_id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select><div style="height:8px"></div><label class="small muted">Tipo</label><select id="editType" class="input"><option value="measurement" ${r.movement_type==='measurement'?'selected':''}>Medición / llenado</option><option value="withdrawal" ${r.movement_type==='withdrawal'?'selected':''}>Retiro por pipero</option></select><div style="height:8px"></div><label class="small muted">Litros</label><input id="editLiters" class="input" type="number" value="${Number(r.liters)}"><div style="height:8px"></div><label class="small muted">Observación</label><input id="editNotes" class="input" value="${esc(r.notes||'')}"><div style="height:12px"></div><button id="saveEdit" class="btn green" style="width:100%">GUARDAR CAMBIOS</button></div>`;document.getElementById('closeModal').onclick=()=>modal.classList.add('hidden');document.getElementById('saveEdit').onclick=async()=>{const liters=Math.round(Number(document.getElementById('editLiters').value)||0),dateValue=document.getElementById('editDate').value;if(liters<=0)return alert('Litros inválidos.');if(!dateValue)return alert('Selecciona fecha y hora.');const row={liters,notes:document.getElementById('editNotes').value.trim()||null,occurred_at:new Date(dateValue).toISOString(),tank_id:Number(document.getElementById('editTank').value),movement_type:document.getElementById('editType').value};const {error}=await sb.from('movements').update(row).eq('id',r.id);if(error)return alert(error.message);modal.classList.add('hidden');historyView()}}
function exportExcel(rows){const data=rows.map(r=>({Fecha:new Date(r.occurred_at).toLocaleString('es-MX'),Tanque:r.tank_id,Tipo:r.movement_type==='withdrawal'?'Retiro':'Medición',Litros:Number(r.liters),Usuario:r.operator_name,Observacion:r.notes||''}));const ws=XLSX.utils.json_to_sheet(data),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Movimientos');XLSX.writeFile(wb,'Milk-WheyApp_movimientos.xlsx')}
async function cutsView(){const c=document.getElementById('content'),now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),1),next=new Date(now.getFullYear(),now.getMonth()+1,1),pay=new Date(now.getFullYear(),now.getMonth()+1,5);const {data:moves}=await sb.from('movements').select('liters').eq('movement_type','withdrawal').gte('occurred_at',start.toISOString()).lt('occurred_at',next.toISOString());const {data:adj}=await sb.from('monthly_adjustments').select('*').eq('period_start',start.toISOString().slice(0,10));const liters=(moves||[]).reduce((a,r)=>a+Number(r.liters),0),base=liters*PRICE;let bonus=0,penalty=0;(adj||[]).forEach(a=>{const v=a.calculation_type==='per_liter'?Number(a.amount)*liters:Number(a.amount);a.adjustment_type==='bonus'?bonus+=v:penalty+=v});c.innerHTML=`<div class="card"><div class="section">Corte ${start.toLocaleDateString('es-MX',{month:'long',year:'numeric'})}</div><div class="grid g3"><div class="kpi">Litros<b>${num(liters)} L</b></div><div class="kpi">Base $0.25/L<b>$${money(base)}</b></div><div class="kpi">Total<b>$${money(base+bonus-penalty)}</b></div></div><div class="notice" style="margin-top:12px">Pago: <b>${pay.toLocaleDateString('es-MX')}</b><br>Bonos: $${money(bonus)} • Penalizaciones: $${money(penalty)}</div></div><div class="card no-print"><div class="section">Agregar ajuste</div><select id="adjType" class="input"><option value="bonus">Bono</option><option value="penalty">Penalización</option></select><div style="height:8px"></div><select id="calcType" class="input"><option value="fixed">Cantidad fija</option><option value="per_liter">Por litro</option></select><div style="height:8px"></div><input id="adjAmount" class="input" type="number" step=".01" placeholder="Cantidad"><div style="height:8px"></div><input id="adjReason" class="input" placeholder="Motivo"><div style="height:10px"></div><button id="saveAdj" class="btn green" style="width:100%">GUARDAR AJUSTE</button></div>`;document.getElementById('saveAdj').onclick=async()=>{const amount=Number(document.getElementById('adjAmount').value)||0;if(amount<=0)return alert('Cantidad inválida.');const {error}=await sb.from('monthly_adjustments').insert({period_start:start.toISOString().slice(0,10),adjustment_type:document.getElementById('adjType').value,calculation_type:document.getElementById('calcType').value,amount,reason:document.getElementById('adjReason').value.trim()||null,created_by:currentUser.id});if(error)return alert(error.message);cutsView()}}
async function adminView(){const c=document.getElementById('content'),p=perms();c.innerHTML='<div class="card">Cargando administración...</div>';const {data:users}=await sb.from('app_users').select('*').order('display_name');let html='';if(p.manage_users)html+=`<div class="card"><div class="section">Permisos por trabajador</div>${(users||[]).filter(u=>u.id!==currentUser.id).map(u=>{const up=u.permissions||{};return `<div class="card" style="margin-top:9px"><div class="row between"><div><b>${esc(u.display_name)}</b><div class="small muted">${esc(u.username)} • ${esc(u.role)}</div></div><button class="btn ${u.active?'danger':'dark'} mini" data-active="${u.id}" data-state="${u.active?'0':'1'}">${u.active?'Desactivar':'Activar'}</button></div><div class="permgrid" style="margin-top:9px">${[['measure','Mediciones'],['withdraw','Retiros'],['view_all','Ver todo'],['edit_movements','Editar movimientos'],['delete_movements','Borrar movimientos'],['export','Exportar'],['finance','Ver finanzas'],['manage_tanks','Administrar tanques']].map(([k,l])=>`<label class="check"><input type="checkbox" data-perm="${u.id}" data-key="${k}" ${up[k]?'checked':''}> ${l}</label>`).join('')}</div><button class="btn dark mini" style="margin-top:9px" data-saveperm="${u.id}">Guardar permisos</button></div>`}).join('')}</div>`;if(p.manage_tanks)html+=`<div class="card"><div class="section">Tanques y fórmulas</div>${tanks.map(t=>`<div class="row between" style="padding:9px 0;border-bottom:1px solid #ffffff10"><div><b>${esc(t.name)}</b><div class="small muted">${num(t.capacity_liters)} L • ${geoName(t)}${t.diameter_cm?` • Ø ${t.diameter_cm} cm`:''}${t.length_cm?` • Largo ${t.length_cm} cm`:''}</div></div><button class="btn dark mini" data-edittank="${t.id}">Editar</button></div>`).join('')}<div style="height:12px"></div><button id="newTank" class="btn green" style="width:100%">AGREGAR TANQUE</button></div>`;html+=`<div class="card"><div class="section">Mi contraseña</div><input id="newPass" class="input" type="password" placeholder="Nueva clave"><div style="height:10px"></div><button id="changeMine" class="btn dark" style="width:100%">CAMBIAR MI CONTRASEÑA</button></div>`;c.innerHTML=html;document.querySelectorAll('[data-active]').forEach(b=>b.onclick=async()=>{const {data,error}=await sb.functions.invoke('admin-users',{body:{action:'set_active',id:b.dataset.active,active:b.dataset.state==='1'}});if(error||data?.error)return alert(error?.message||data.error);adminView()});document.querySelectorAll('[data-saveperm]').forEach(b=>b.onclick=async()=>{const id=b.dataset.saveperm,obj={};document.querySelectorAll(`[data-perm="${id}"]`).forEach(x=>obj[x.dataset.key]=x.checked);const {error}=await sb.from('app_users').update({permissions:obj}).eq('id',id);if(error)return alert(error.message);alert('Permisos guardados.')});document.querySelectorAll('[data-edittank]').forEach(b=>b.onclick=()=>tankEditor(tanks.find(t=>String(t.id)===b.dataset.edittank)));if(document.getElementById('newTank'))document.getElementById('newTank').onclick=()=>tankEditor(null);document.getElementById('changeMine').onclick=async()=>{const password=document.getElementById('newPass').value;if(password.length<8)return alert('Mínimo 8 caracteres.');const {data,error}=await sb.functions.invoke('admin-users',{body:{action:'change_password',id:currentUser.id,password}});if(error||data?.error)return alert(error?.message||data.error);alert('Contraseña actualizada.')}}
function tankEditor(t){modal.classList.remove('hidden');modal.innerHTML=`<div class="sheet"><div class="row between"><div class="section">${t?'Editar':'Nuevo'} tanque</div><button id="closeModal" class="btn dark mini">Cerrar</button></div><input id="tn" class="input" placeholder="Nombre" value="${esc(t?.name||'')}"><div style="height:8px"></div><input id="tc" class="input" type="number" placeholder="Capacidad en litros" value="${t?.capacity_liters||''}"><div style="height:8px"></div><select id="tg" class="input"><option value="direct" ${t?.geometry_type==='direct'?'selected':''}>Captura directa</option><option value="horizontal_cylinder" ${t?.geometry_type==='horizontal_cylinder'?'selected':''}>Pipa / cilindro horizontal</option><option value="vertical_cylinder" ${t?.geometry_type==='vertical_cylinder'?'selected':''}>Cilíndrico vertical</option></select><div style="height:8px"></div><input id="td" class="input" type="number" step=".1" placeholder="Diámetro (cm)" value="${t?.diameter_cm||''}"><div style="height:8px"></div><input id="tl" class="input" type="number" step=".1" placeholder="Largo (cm) — para pipa" value="${t?.length_cm||''}"><div style="height:8px"></div><input id="th" class="input" type="number" step=".1" placeholder="Altura total (cm)" value="${t?.height_cm||''}"><div style="height:8px"></div><input id="tnote" class="input" placeholder="Notas" value="${esc(t?.tank_notes||'')}"><div style="height:12px"></div><button id="saveTank" class="btn green" style="width:100%">GUARDAR TANQUE</button></div>`;document.getElementById('closeModal').onclick=()=>modal.classList.add('hidden');document.getElementById('saveTank').onclick=async()=>{const row={name:document.getElementById('tn').value.trim(),capacity_liters:Math.round(Number(document.getElementById('tc').value)||0),geometry_type:document.getElementById('tg').value,diameter_cm:Number(document.getElementById('td').value)||null,length_cm:Number(document.getElementById('tl').value)||null,height_cm:Number(document.getElementById('th').value)||null,tank_notes:document.getElementById('tnote').value.trim()||null,active:true};if(!row.name||row.capacity_liters<=0)return alert('Nombre y capacidad son obligatorios.');let error;if(t){({error}=await sb.from('tanks').update(row).eq('id',t.id))}else{const id=Math.max(0,...tanks.map(x=>Number(x.id)))+1;({error}=await sb.from('tanks').insert({...row,id}))}if(error)return alert(error.message);await loadTanks();modal.classList.add('hidden');adminView()}}
(async()=>{await bootstrapAdmin();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});const {data:{session}}=await sb.auth.getSession();if(session){currentUser=session.user;try{await loadProfile();await loadTanks();render()}catch(e){loginView()}}else loginView()})();
</script></body></html>
